<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CouchWorld 片头标注数据，查看各剧集的跳过片头时间及公开 JSON。">
  <title>CouchWorld · 片头标注</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182c29; background: #f4f6f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: 72px 24px; }
    .brand { color: #426c5e; font-size: 14px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 20px 0 14px; font-size: clamp(32px, 6vw, 48px); letter-spacing: -.04em; }
    p { line-height: 1.8; color: #53645d; }
    .intro { max-width: 600px; margin-bottom: 36px; }
    .list { display: grid; gap: 16px; }
    article { background: white; border: 1px solid #dce4db; border-radius: 16px; padding: 24px; }
    h2 { margin: 0 0 10px; font-size: 22px; }
    article p { margin: 0 0 18px; }
    a { color: #206b50; text-underline-offset: 4px; }
    a:hover { color: #103f2e; }
    a:focus-visible { outline: 3px solid #206b50; outline-offset: 5px; }
    footer { margin-top: 36px; font-size: 14px; line-height: 1.8; color: #53645d; }
    @media (max-width: 480px) { main { padding: 40px 20px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">COUCHWORLD</div>
    <h1>片头标注</h1>
    <p class="intro">为追剧少等一段片头。这里提供欧乐剧集的跳过片头时间，播放器可通过公开 JSON 地址读取标注。</p>
    <div class="list">
      <article data-source="api/v1/intros/olevod/84001.json">
        <h2>剧集 84001</h2>
        <p class="marker" aria-live="polite">片头时间请查看 JSON 标注。</p>
        <a href="api/v1/intros/olevod/84001.json">查看 JSON 标注 →</a>
      </article>
      <article data-source="api/v1/intros/olevod/85232.json">
        <h2>剧集 85232</h2>
        <p class="marker" aria-live="polite">片头时间请查看 JSON 标注。</p>
        <a href="api/v1/intros/olevod/85232.json">查看 JSON 标注 →</a>
      </article>
    </div>
    <footer>时间来自人工标注，单集例外优先于全剧默认值。<br>
      <a href="https://github.com/pookyl/couchworld-intro-data">在 GitHub 查看数据和维护工具</a>
    </footer>
  </main>
  <script>
    const formatTime = seconds => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    document.querySelectorAll('[data-source]').forEach(async card => {
      const label = card.querySelector('.marker');
      try {
        const response = await fetch(card.dataset.source);
        if (!response.ok) throw new Error('数据暂时不可用');
        const data = await response.json();
        const intro = data.defaultIntro;
        label.textContent = !intro ? '未设置全剧默认值，请查看单集标注。'
          : intro.disabled ? '全剧默认禁用跳过片头。'
          : `全剧默认 · ${formatTime(intro.start)}–${formatTime(intro.end)}，跳转到 ${formatTime(intro.end)}`;
      } catch {
        label.textContent = '暂时无法加载时间，请点击下方链接查看标注。';
      }
    });
  </script>
</body>
</html>
